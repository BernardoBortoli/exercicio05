<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de adivinhação</title>
     <script src="script.js" defer></script>
</head>
<body>
    <div class="corpo">
        <h1>TENTE ADIVINHAR O NÚMERO MISTERIOSO</h1>
        <p class="enunciado">Um número aleatório entre 1 e 100 foi escolhido, tente adivinhar qual é esse número!</p>

        <div class="instrucoes">
            <h2>COMO JOGAR:</h2>
            <ul>
                <li>Escolha um número entre 1 e 100, e clique em 'CHUTAR', você possui apenas 5 tentativas.</li>
            </ul>
        </div>

        <div class="jogo">
            <input type="number" id="MN" placeholder="Escolha um número entre 1 e 100">
            <button id="C" class="BotaoChute">CHUTAR</button>
            <button id="A" class="BotaoAgain">TENTAR NOVAMENTE</button>
        </div>

        <p id="tip" class="info"></p>
        <p id="try" class="tentativas"></p>
    </div>
</body>
</html>
